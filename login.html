<!-- 
  login.html: The login page for Rooz website users
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooz - Login</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Login Section -->
  <section class="login-section">
    <div class="login-container">
      <h2 class="login-title">Rooz Login</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="input-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button class="login-button" type="submit">Login</button>
      </form>
      <div class="notification-container">
        <!-- Notification messages will be displayed here -->
      </div>
    </div>
  </section>

  <!-- Floating Notification Window -->
  <div class="floating-notification" id="floating-notification">
    <div class="notification-content">
      <p id="notification-message"></p>
      <button class="close-notification" id="close-notification">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
