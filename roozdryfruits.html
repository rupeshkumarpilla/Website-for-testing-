<!-- 
  roozdryfruits.html: The page for Rooz Dry Fruits sub-brand
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooz Dry Fruits - Home</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Add custom styles for Rooz Dry Fruits page */
    .roozdryfruits-header {
      background-image: linear-gradient(to bottom, #f7f7f7, #fff);
      padding: 2em;
      text-align: center;
    }
    
    .roozdryfruits-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2em;
    }
    
    .roozdryfruits-button {
      background: linear-gradient(to bottom, #fff, #f7f7f7);
      border: none;
      border-radius: 10px;
      padding: 1em 2em;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .roozdryfruits-button:hover {
      background: linear-gradient(to bottom, #f7f7f7, #fff);
    }
    
    .roozdryfruits-floating-window {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #fff;
      padding: 2em;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      display: none;
    }
    
    .roozdryfruits-floating-window.show {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Header Section -->
  <header class="roozdryfruits-header">
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>
  
  <!-- Content Section -->
  <section class="roozdryfruits-content">
    <h1>Rooz Dry Fruits</h1>
    <p>Welcome to Rooz Dry Fruits, your one-stop shop for all your dry fruit needs.</p>
    <button class="roozdryfruits-button" id="roozdryfruits-login-button">Login</button>
    <button class="roozdryfruits-button" id="roozdryfruits-notification-button">Notification</button>
  </section>
  
  <!-- Floating Window -->
  <div class="roozdryfruits-floating-window" id="roozdryfruits-floating-window">
    <h2>Notification</h2>
    <p>This is a notification.</p>
    <button class="roozdryfruits-button" id="roozdryfruits-close-button">Close</button>
  </div>
  
  <script src="script.js"></script>
  <script>
    // Get elements
    const loginButton = document.getElementById('roozdryfruits-login-button');
    const notificationButton = document.getElementById('roozdryfruits-notification-button');
    const closeButton = document.getElementById('roozdryfruits-close-button');
    const floatingWindow = document.getElementById('roozdryfruits-floating-window');
    
    // Add event listeners
    loginButton.addEventListener('click', () => {
      // Redirect to login page
      window.location.href = 'login.html';
    });
    
    notificationButton.addEventListener('click', () => {
      // Show floating window
      floatingWindow.classList.add('show');
    });
    
    closeButton.addEventListener('click', () => {
      // Hide floating window
      floatingWindow.classList.remove('show');
    });
  </script>
</body>
</html>
